[project]
name = "coverage_kernel"
version = "0.2.0"
description = "Coverage-dependent branching-probability models (NN ensemble and grid scheme) for DSMC gas-surface boundary conditions, with a Fortran inference port."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "joblib",
    "h5py",
]

[project.optional-dependencies]
train = ["jax", "flax", "optax"]          # NN training (coverage_kernel.nn_train)
data = ["pandas", "znh5md"]              # impact-data reader (coverage_kernel.data)
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coverage_kernel*"]
